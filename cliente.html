<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Área do Cliente — Pagode IPTV</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08080c;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px 7%;
      background: #101017;
      border-bottom: 1px solid #ffffff12;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
    }

    .logo span {
      color: #b000ff;
    }

    .sair {
      color: white;
      text-decoration: none;
      border: 1px solid #ffffff33;
      padding: 9px 18px;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 50px 25px;
    }

    .boas-vindas {
      margin-bottom: 35px;
    }

    .boas-vindas h1 {
      margin-bottom: 10px;
    }

    .boas-vindas p {
      color: #999;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #15151d;
      border: 1px solid #ffffff12;
      border-radius: 15px;
      padding: 30px;
    }

    .icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .card p {
      color: #999;
      line-height: 1.5;
    }

    @media (max-width: 750px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      PAGODE <span>IPTV</span>
    </div>

    <a href="index.html" class="sair">
      Sair
    </a>

  </header>

  <main>

    <div class="boas-vindas">
      <h1>Área do Cliente</h1>
      <p>Bem-vindo ao seu painel Pagode IPTV.</p>
    </div>

    <div class="cards">

      <div class="card">
        <div class="icon">📺</div>
        <h2>Assistir</h2>
        <p>
          Acesse seus conteúdos autorizados.
        </p>
      </div>

      <div class="card">
        <div class="icon">👤</div>
        <h2>Minha conta</h2>
        <p>
          Consulte as informações da sua conta.
        </p>
      </div>

      <div class="card">
        <div class="icon">📅</div>
        <h2>Assinatura</h2>
        <p>
          Consulte o status da sua assinatura.
        </p>
      </div>

    </div>

  </main>

</body>
</html>
